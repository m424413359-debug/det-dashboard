name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B6A70' --iconBackgroundColorDark '#0B6A70' --splashBackgroundColor '#0B6A70' --splashBackgroundColorDark '#0E181C' || echo "assets generation skipped"

      - name: Sync web files
        run: npx cap sync android

      - name: Set version and signing key
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android
          cp assets/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../det-prep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: det-prep-apk
          path: det-prep.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest det-prep.apk \
            --title "تحضير الدولينجو — نسخة ${{ github.run_number }}" \
            --notes "نزّل ملف det-prep.apk وثبّته على جوالك. التحديث بيحافظ على تقدّمك." \
            --target ${{ github.sha }}
